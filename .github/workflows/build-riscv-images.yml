name: Build Argo CD RISC-V Images

on:
  push:
    branches:
      - codex/riscv64-build
  workflow_dispatch:
    inputs:
      image_repo:
        description: Destination GHCR repository for the built Argo CD image
        required: true
        default: ghcr.io/troibe/argocd/argocd
      push_latest_riscv:
        description: Also push the moving latest-riscv64 tag
        required: true
        type: boolean
        default: false

concurrency:
  group: build-argocd-riscv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-argocd-image:
    runs-on: neo5
    container:
      image: ghcr.io/osscontainertools/kaniko:debug
    steps:
      - name: Resolve image tags
        run: |
          IMAGE_REPO="${{ inputs.image_repo || 'ghcr.io/troibe/argocd/argocd' }}"
          VERSION_TAG="${GITHUB_SHA}-riscv64"
          PUSH_LATEST="${{ inputs.push_latest_riscv }}"
          if [ -z "${PUSH_LATEST}" ]; then
            PUSH_LATEST="false"
          fi

          echo "IMAGE_REPO=${IMAGE_REPO}" >> "${GITHUB_ENV}"
          echo "VERSION_TAG=${VERSION_TAG}" >> "${GITHUB_ENV}"
          echo "PUSH_LATEST=${PUSH_LATEST}" >> "${GITHUB_ENV}"

      - name: Configure GHCR auth for Kaniko
        run: |
          mkdir -p /kaniko/.docker
          cat > /kaniko/.docker/config.json <<EOF
          {
            "auths": {
              "ghcr.io": {
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GHCR_TOKEN }}"
              }
            }
          }
          EOF

      - name: Build and push shared Argo CD image
        env:
          GIT_USERNAME: ${{ github.actor }}
          GIT_PASSWORD: ${{ secrets.GH_TOKEN }}
        run: |
          DEST_ARGS="--destination ${IMAGE_REPO}:${VERSION_TAG}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            DEST_ARGS="${DEST_ARGS} --destination ${IMAGE_REPO}:latest-riscv64"
          fi

          /kaniko/executor \
            --context "${{ github.repositoryUrl }}#${{ github.ref }}#${{ github.sha }}" \
            --verbosity=info \
            --dockerfile "Dockerfile" \
            ${DEST_ARGS} \
            --cleanup

      - name: Summary
        run: |
          echo "Built and pushed:"
          echo "  ${IMAGE_REPO}:${VERSION_TAG}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            echo "  ${IMAGE_REPO}:latest-riscv64"
          fi
